// ══════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════
onAuthStateChanged(auth, async user => {
  if (user) {
    const profile = TEAM_PROFILES[user.email];
    if (!profile) { await signOut(auth); showLogin("Email not recognized."); return; }
    currentUser    = user;
    currentProfile = { ...profile, email: user.email, uid: user.uid };
    showApp();
  } else {
    currentUser    = null;
    currentProfile = null;
    showLogin();
  }
});

function showLogin(errMsg = "") {
  document.getElementById("login").style.display = "flex";
  document.getElementById("app").style.display   = "none";
  document.getElementById("login-err").textContent = errMsg;
}

async function doLogin() {
  const email = document.getElementById("l-email").value.trim();
  const pass  = document.getElementById("l-pass").value;
  document.getElementById("login-err").textContent = "";
  document.getElementById("login-btn").textContent = "Signing in...";
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    console.error("Firebase auth error:", e.code, e.message);
    const msg = e.code === "auth/invalid-credential" ? "Wrong email or password." :
                e.code === "auth/user-not-found" ? "Email not found in Firebase." :
                e.code === "auth/wrong-password" ? "Wrong password." :
                e.code === "auth/invalid-email" ? "Invalid email format." :
                e.code === "auth/network-request-failed" ? "Network error — check your connection." :
                "Error: " + e.code;
    document.getElementById("login-err").textContent = msg;
    document.getElementById("login-btn").textContent = "Sign in";
  }
}

async function doLogout() {
  unsubs.forEach(u => u());
  unsubs = [];
  await signOut(auth);
}

function showApp() {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display   = "flex";
  document.getElementById("sidebar-name").textContent = currentProfile.name;
  document.getElementById("sidebar-role").textContent = currentProfile.role;
  buildNav();
  go("overview");
}

function buildNav() {
  const nav = getNav(currentProfile.access);
  document.getElementById("nav-list").innerHTML = nav.map(n =>
    `<button class="nav-item" id="nav-${n.id}" onclick="go('${n.id}')">
      <span class="nav-icon">${n.icon}</span>${n.label}
    </button>`).join("");
}

function setActiveNav(id) {
  document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
  const el = document.getElementById("nav-" + id);
  if (el) el.classList.add("active");
}

async function renderTeam() {
  const snap = await getDocs(collection(db,"tasks"));
  const tasks = snap.docs.map(d=>d.data());
  const members = Object.entries(TEAM_PROFILES);
  setMain(`
  <div class="page-title">Team (${members.length})</div>
  <div class="card">
    ${members.map(([email,p])=>{
      const open = tasks.filter(t=>t.assignee===p.name&&!t.done).length;
      const done = tasks.filter(t=>t.assignee===p.name&&t.done).length;
      return `<div class="team-row">
        <div class="avatar" style="width:34px;height:34px;font-size:12px;background:${p.color};color:${p.tc}">${p.init}</div>
        <div style="flex:1"><div style="font-size:13px;font-weight:500">${p.name}</div>
          <div style="font-size:11px;color:var(--text2)">${p.role}</div></div>
        <span class="badge info">${p.access}</span>
        <span style="font-size:12px;color:var(--text2)">${open} open · ${done} done</span>
      </div>`;}).join("")}
  </div>`);
}

async function renderGoals() {
  const snap = await getDocs(query(collection(db,"goals"), orderBy("createdAt","desc")));
  const goals = snap.docs.map(d=>({id:d.id,...d.data()}));
  const SM = {track:{cls:"g",label:"On track",c:"var(--green)"},risk:{cls:"a",label:"At risk",c:"var(--amber)"},behind:{cls:"r",label:"Behind",c:"var(--red)"}};
  setMain(`
  <div class="page-title">Goals — Q2 2026</div>
  <div class="metrics">
    <div class="metric"><div class="ml">Total</div><div class="mv">${goals.length}</div></div>
    <div class="metric"><div class="ml">On track</div><div class="mv" style="color:var(--green)">${goals.filter(g=>g.status==="track").length}</div></div>
    <div class="metric"><div class="ml">At risk</div><div class="mv" style="color:var(--amber)">${goals.filter(g=>g.status==="risk").length}</div></div>
    <div class="metric"><div class="ml">Behind</div><div class="mv" style="color:var(--red)">${goals.filter(g=>g.status==="behind").length}</div></div>
  </div>
  <div class="card">
    ${goals.length ? goals.map(g=>{const s=SM[g.status]||SM.track;return`
      <div class="goal-row">
        <div style="flex:1.2;min-width:0"><div style="font-size:13px;font-weight:500">${g.name}</div>
          <div style="font-size:11px;color:var(--text2)">${g.cat} · ${g.owner||""}</div></div>
        <div style="flex:1.5"><div class="track"><div class="fill ${s.cls}" style="width:${g.pct||0}%"></div></div></div>
        <div style="font-size:12px;font-weight:600;color:var(--text2);min-width:32px;text-align:right">${g.pct||0}%</div>
        <span style="font-size:10px;padding:2px 7px;border-radius:5px;font-weight:600;color:${s.c};background:${s.c}18">${s.label}</span>
        ${isAdmin()?`<button class="icon-btn" onclick="editGoal('${g.id}')">✏️</button>`:""}
      </div>`;}).join("") : empty("No goals yet — add one below")}
    ${isAdmin()?`<button class="btn primary" style="margin-top:12px" onclick="openGoalModal()">+ Add goal</button>`:""}
  </div>`);
}

async function renderFinancials() {
  if (!isFinance()) { setMain(`<div class="page-title">Financials</div><p style="color:var(--text2)">Access restricted.</p>`); return; }
  const snap = await getDocs(query(collection(db,"financials"), orderBy("date","desc")));
  const items = snap.docs.map(d=>({id:d.id,...d.data()}));
  const revenue  = items.filter(i=>i.type==="revenue").reduce((s,i)=>s+(i.amount||0),0);
  const expenses = items.filter(i=>i.type==="expense").reduce((s,i)=>s+(i.amount||0),0);
  const payroll  = items.filter(i=>i.type==="payroll").reduce((s,i)=>s+(i.amount||0),0);
  const net = revenue - expenses - payroll;
  setMain(`
  <div class="page-title">Financials</div>
  <div class="metrics">
    <div class="metric"><div class="ml">Revenue</div><div class="mv" style="color:var(--green)">$${revenue.toLocaleString()}</div></div>
    <div class="metric"><div class="ml">Payroll</div><div class="mv" style="color:var(--amber)">$${payroll.toLocaleString()}</div></div>
    <div class="metric"><div class="ml">Expenses</div><div class="mv" style="color:var(--red)">$${expenses.toLocaleString()}</div></div>
    <div class="metric"><div class="ml">Net</div><div class="mv" style="color:${net>=0?"var(--green)":"var(--red)"}">$${net.toLocaleString()}</div></div>
  </div>
  <div class="card">
    <div class="card-head"><div class="card-title">All entries</div>
      <button class="btn primary" onclick="openFinancialModal()">+ Add entry</button></div>
    ${items.length ? items.map(i=>`
      <div class="pay-row">
        <span style="font-size:18px">${i.type==="revenue"?"💚":i.type==="payroll"?"💛":"🔴"}</span>
        <div style="flex:1"><div style="font-size:13px;font-weight:500">${i.label||i.type}</div>
          <div style="font-size:11px;color:var(--text2)">${i.type} · ${fmtDate(i.date)} ${i.note?`· ${i.note}`:""}</div></div>
        <span style="font-size:14px;font-weight:600;color:${i.type==="revenue"?"var(--green)":"var(--red)"}">${i.type==="revenue"?"+":"-"}$${(i.amount||0).toLocaleString()}</span>
        ${isAdmin()?`<button class="icon-btn" onclick="deleteFinancial('${i.id}')">🗑</button>`:""}
      </div>`).join("") : empty("No entries yet — add revenue, payroll, and expenses")}
  </div>`);
}

async function renderLinks() {
  // Try to load custom links from Firestore, fall back to defaults
  let myLinks = links.filter(l => l.roles.includes("all") || l.roles.includes(currentProfile.access));
  try {
    const snap = await getDocs(collection(db,"links"));
    if (snap.size > 0) myLinks = snap.docs.map(d=>d.data()).filter(l=>!l.roles||l.roles.includes("all")||l.roles.includes(currentProfile.access));
  } catch(e) {}
  setMain(`
  <div class="page-title">Quick links</div>
  <div class="card">
    <div class="links-grid">
      ${myLinks.map(l=>`
        <a class="link-card" href="${l.url}" target="_blank" rel="noopener">
          <div class="link-icon">${l.icon}</div>
          <div class="link-name">${l.name}</div>
          <div class="link-desc">${l.desc}</div>
        </a>`).join("")}
    </div>
  </div>`);
}

window.go = function(view) {
  currentView = view;
  setActiveNav(view);
  const m = document.getElementById("main");
  m.innerHTML = `<div style="padding:2rem;color:var(--text2);font-size:13px">Loading...</div>`;
  const views = {
    overview:     renderOverview,
    allTasks:     renderAllTasks,
    tasks:        renderMyTasks,
    content:      renderContentHub,
    training:     renderTrainingHub,
    calltracker:  renderCallTracker,
    team:         renderTeam,
    timeoff:      renderTimeOff,
    goals:        renderGoals,
    financials:   renderFinancials,
    analytics:    renderAnalytics,
    updates:      renderUpdates,
    links:        renderLinks,
    sales:        renderSalesBoard,
    calendar:     renderCalendar,
    settings:     renderSettings,
  };
  if (views[view]) views[view]();
  else m.innerHTML = `<div class="page-title">${view}</div><p style="color:var(--text2)">Coming soon</p>`;
};

const isFinance  = () => FINANCE_ACCESS.includes(currentProfile?.access);
const profileOf  = email => Object.values(TEAM_PROFILES).find(p => p.name === email) || {color:"var(--bg2)",tc:"var(--text2)",init:"?"};
const initials   = name  => name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
function avatar(name, size=26) {
  const p = profileOf(name); const fs = Math.round(size*0.38);
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${fs}px;background:${p.color};color:${p.tc}">${initials(name)}</div>`;
}
function badge(cls, label) { return `<span class="badge ${cls}">${label}</span>`; }
function empty(msg)        { return `<div class="empty">${msg}</div>`; }
function fmtDate(d)        { if(!d) return "TBD"; return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2800);
}
function setMain(html) { document.getElementById("main").innerHTML = html; }

async function renderMemberOverview() {
  const [taskSnap, annSnap, asnSnap, progSnap] = await Promise.all([
    getDocs(query(collection(db,"tasks"), where("assignee","==",currentProfile.name))),
    getDocs(query(collection(db,"announcements"), orderBy("createdAt","desc"))),
    getDocs(query(collection(db,"training_assignments"), where("personName","==",currentProfile.name))),
    getDocs(query(collection(db,"training_progress"), where("uid","==",currentUser.uid))),
  ]);
  const mine      = taskSnap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>!t.done);
  const ann       = annSnap.docs.slice(0,3).map(d=>d.data());
  const myTracks  = asnSnap.docs.map(d=>d.data().track);
  const progress  = {};
  progSnap.docs.forEach(d=>{const x=d.data(); progress[x.lessonKey]=x.done;});
  const totalLessons = myTracks.reduce((s,t)=>(DEFAULT_TRAINING[t]?.lessons?.length||0)+s,0);
  const doneLessons  = Object.values(progress).filter(Boolean).length;
  const trainPct     = totalLessons ? Math.round(doneLessons/totalLessons*100) : 0;
  const nextLesson   = (() => {
    for (const track of myTracks) {
      const lessons = DEFAULT_TRAINING[track]?.lessons||[];
      const idx = lessons.findIndex((_,i)=>!progress[`${track}:${i}`]);
      if (idx !== -1) return {track, lesson:lessons[idx], idx};
    }
    return null;
  })();

  setMain(`
  <div class="page-title">Hola, ${currentProfile.name.split(" ")[0]} 👋</div>
  <div class="metrics" style="grid-template-columns:repeat(3,1fr)">
    <div class="metric"><div class="ml">Tareas abiertas</div><div class="mv">${mine.length}</div></div>
    <div class="metric"><div class="ml">Alta prioridad</div><div class="mv" style="color:var(--red)">${mine.filter(t=>t.pri==="high").length}</div></div>
    <div class="metric"><div class="ml">Entrenamiento</div><div class="mv" style="color:${trainPct===100?"var(--green)":trainPct>0?"var(--amber)":"var(--text3)"}">${trainPct}%</div><div class="ms">${doneLessons}/${totalLessons} lecciones</div></div>
  </div>

  ${nextLesson ? `
  <div class="card" style="border-left:3px solid var(--blue);cursor:pointer" onclick="go('training')">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:24px">🎓</span>
      <div style="flex:1">
        <div style="font-size:11px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">Siguiente lección</div>
        <div style="font-size:14px;font-weight:500">${nextLesson.lesson.title}</div>
        <div style="font-size:11px;color:var(--text2)">${nextLesson.track} · ${nextLesson.lesson.duration}</div>
      </div>
      <span style="font-size:12px;color:var(--blue);font-weight:500">Ir →</span>
    </div>
  </div>` : myTracks.length ? `
  <div class="card" style="border-left:3px solid var(--green)">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:24px">🏆</span>
      <div><div style="font-size:14px;font-weight:500">¡Entrenamiento completado!</div>
      <div style="font-size:12px;color:var(--text2)">Has completado todos tus tracks asignados.</div></div>
    </div>
  </div>` : ""}

  <div class="card">
    <div class="card-head"><div class="card-title">Mis tareas</div></div>
    ${mine.length ? mine.slice(0,6).map(t=>`
      <div class="task-row-simple">
        <div class="task-body"><div class="task-name">${t.text}</div>
          <div class="task-sub">Due ${fmtDate(t.due)}</div></div>
        ${badge(t.pri,t.pri)}
      </div>`).join("") : empty("¡Todo al día! 🎉")}
  </div>
  <div class="card">
    <div class="card-head"><div class="card-title">Updates del equipo</div></div>
    ${ann.map(a=>`<div class="announce"><div class="announce-title">${a.text}</div>
      <div class="announce-meta">Posteado por ${a.by} · ${a.createdAt?.toDate?.()?.toLocaleDateString()||"recientemente"}</div>
    </div>`).join("")||empty("No hay updates aún")}
  </div>`);
}

let taskModalMode = "new";
let editTaskId    = null;

window.openTaskModal = function(taskId=null) {
  taskModalMode = taskId ? "edit" : "new";
  editTaskId    = taskId;
  document.getElementById("tm-title").textContent = taskId ? "Edit task" : "New task";
  document.getElementById("tm-name").value  = "";
  document.getElementById("tm-notes").value = "";
  document.getElementById("tm-due").value   = "";
  document.getElementById("tm-recur").value = "none";
  document.getElementById("tm-pri").value   = "med";
  document.getElementById("tm-who").innerHTML = Object.values(TEAM_PROFILES).map(p=>
    `<option value="${p.name}">${p.name} — ${p.role}</option>`).join("");
  if (taskId) {
    getDoc(doc(db,"tasks",taskId)).then(d => {
      const t = d.data();
      document.getElementById("tm-name").value  = t.text||"";
      document.getElementById("tm-notes").value = t.notes||"";
      document.getElementById("tm-due").value   = t.due||"";
      document.getElementById("tm-recur").value = t.recur||"none";
      document.getElementById("tm-pri").value   = t.pri||"med";
      document.getElementById("tm-who").value   = t.assignee||"";
    });
  }
  document.getElementById("task-modal").style.display = "flex";
};

window.closeTaskModal = function() {
  document.getElementById("task-modal").style.display = "none";
};

window.saveTask = async function() {
  const text     = document.getElementById("tm-name").value.trim(); if(!text) return;
  const assignee = document.getElementById("tm-who").value;
  const pri      = document.getElementById("tm-pri").value;
  const due      = document.getElementById("tm-due").value;
  const recur    = document.getElementById("tm-recur").value;
  const notes    = document.getElementById("tm-notes").value.trim();
  const data = { text, assignee, pri, due, recur, notes, done:false,
    updatedAt: serverTimestamp(),
    updatedBy: currentProfile.name };
  if (taskModalMode === "edit" && editTaskId) {
    await updateDoc(doc(db,"tasks",editTaskId), data);
    toast("Task updated ✓");
  } else {
    data.createdAt  = serverTimestamp();
    data.createdBy  = currentProfile.name;
    data.subtasks   = [];
    data.completedDates = [];
    await addDoc(collection(db,"tasks"), data);
    toast("Task created ✓");
  }
  closeTaskModal();
  go(currentView);
};

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="font-size:13px;font-weight:600">${k}</div>
        <div style="display:flex;gap:4px">
          <button class="btn" style="font-size:10px;padding:3px 8px" onclick="expandTemplate('${k}',this)">Show steps</button>
          <button class="btn primary" style="font-size:10px;padding:3px 8px" onclick="applyTemplate('${k}')">Use ✓</button>
        </div>
      </div>
      <div id="tmpl-steps-${k.replace(/[^a-z0-9]/gi,'_')}" style="display:none">
        ${TASK_TEMPLATES[k].map((step,i)=>`
          <div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:0.5px solid var(--border)">

            <button onclick="removeTemplateStep('${k}',${i})" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px">✕</button>
          </div>`).join("")}
        <button onclick="addTemplateStep('${k}')" class="btn" style="font-size:11px;margin-top:6px;width:100%">+ Add step</button>
      </div>
    </div>`).join("");
};

window.expandTemplate = function(name, btn) {
  const id = "tmpl-steps-"+name.replace(/[^a-z0-9]/gi,"_");
  const el = document.getElementById(id); if(!el) return;
  const showing = el.style.display!=="none";
  el.style.display = showing?"none":"block";
  btn.textContent = showing?"Show steps":"Hide steps";
};

window.removeTemplateStep = function(name, idx) {
  TASK_TEMPLATES[name].splice(idx,1);
  openTemplateModal();
};

window.addTemplateStep = function(name) {
  TASK_TEMPLATES[name].push("New step");
  openTemplateModal();
  // Re-expand
  setTimeout(()=>{
    const id="tmpl-steps-"+name.replace(/[^a-z0-9]/gi,"_");
    const el=document.getElementById(id); if(el) el.style.display="block";
  },50);
};

window.closeTemplateModal = function() {
  document.getElementById("template-modal").style.display = "none";
};

window.applyTemplate = async function(name) {
  const steps = TASK_TEMPLATES[name];
  const assignee = document.getElementById("tm-who")?.value || currentProfile.name;
  for (const step of steps) {
    await addDoc(collection(db,"tasks"), {
      text: step, assignee, pri:"med", due:"", recur:"none", notes:"",
      done:false, subtasks:[], completedDates:[],
      templateName: name, createdAt: serverTimestamp(), createdBy: currentProfile.name,
    });
  }
  closeTemplateModal(); closeTaskModal();
  toast(`${steps.length} tasks created from "${name}" template ✓`);
  go(currentView);
};

function taskRowHTML(t, showAssignee=true) {
  return `
  <div class="task-item" id="ti-${t.id}">
    <div class="task-row-inner">
      <input type="checkbox" class="task-cb" ${t.done?"checked":""} onchange="toggleTask('${t.id}','${t.recur||"none"}')">
      <div class="task-body">
        <div class="task-name ${t.done?"done":""}">${t.text}</div>
        <div class="task-sub">
          ${showAssignee?`<span>${t.assignee}</span>`:""}
          ${t.due?`<span>Due ${fmtDate(t.due)}</span>`:""}
          ${t.recur&&t.recur!=="none"?`<span class="recur-tag">↻ ${t.recur}</span>`:""}
          ${t.templateName?`<span class="tmpl-tag">${t.templateName}</span>`:""}
        </div>
      </div>
      ${badge(t.done?"done-b":t.pri, t.done?"done":t.pri)}
      ${showAssignee?avatar(t.assignee,24):""}
      <div class="task-actions">
        <button class="icon-btn" onclick="editTask('${t.id}')">✏️</button>
        <button class="icon-btn" onclick="deleteTask('${t.id}')">🗑</button>
      </div>
    </div>
  </div>`;
}

window.toggleTask = async function(id, recur) {
  const ref  = doc(db,"tasks",id);
  const snap = await getDoc(ref);
  const t    = snap.data();
  const now  = new Date().toISOString().split("T")[0];
  const newDone = !t.done;
  const dates = t.completedDates||[];
  if (newDone) dates.push(now);
  await updateDoc(ref,{done:newDone, completedDates:dates, updatedAt:serverTimestamp()});
  if (newDone && recur && recur!=="none") {
    const base = new Date(t.due||now);
    if(recur==="daily")   base.setDate(base.getDate()+1);
    if(recur==="weekly")  base.setDate(base.getDate()+7);
    if(recur==="monthly") base.setMonth(base.getMonth()+1);
    const newDue = base.toISOString().split("T")[0];
    await addDoc(collection(db,"tasks"),{...t, done:false, due:newDue,
      completedDates:[], createdAt:serverTimestamp(), createdBy:"system"});
    toast(`↻ Recurring task created for ${fmtDate(newDue)}`);
  } else toast(newDone ? "Task done ✓" : "Task reopened");
  go(currentView);
};

window.editTask   = id => openTaskModal(id);
window.deleteTask = async function(id) {
  if (!confirm("Delete this task?")) return;
  await deleteDoc(doc(db,"tasks",id));
  toast("Deleted"); go(currentView);
};
window.setTaskFilter = function(f,btn) {
  taskFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  go("allTasks");
};

async function loadContentBoard(typeFilter) {
  const snap = await getDocs(query(collection(db,"content"), orderBy("createdAt","desc")));
  const all  = snap.docs.map(d => ({id:d.id, ...d.data()}));
  const items = typeFilter === "all" ? all : all.filter(c => c.type === typeFilter);
  const wrap = document.getElementById("content-board-wrap");
  if (!wrap) return;

  const stageColors = {
    "Bank of Ideas":"#854f0b","Idea Approved by Jaz":"#3b6d11","Ideas Not Approved":"#a32d2d",
    "Script in Progress":"#185fa5","Script Approved":"#3b6d11","Create Canva Presentation":"#534ab7",
    "Canva Ready":"#534ab7","Recording":"#185fa5","Edit Long-form":"#185fa5","Edit Short-form":"#185fa5",
    "Thumbnail Description":"#854f0b","Thumbnail Design":"#854f0b","QA":"#a32d2d",
    "Upload to Skool":"#3b6d11","Upload to YouTube":"#3b6d11","Post to Social Media":"#3b6d11",
    "CTA Comment + Pin":"#3b6d11","Done":"#aaa",
  };

  let html = '<div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:1rem">';
  CONTENT_STAGES.forEach(stage => {
    const stageItems = items.filter(c => c.stage === stage);
    const color = stageColors[stage] || "#aaa";
    html += `<div style="flex-shrink:0;width:190px;background:var(--bg2);border-radius:var(--rl);padding:10px">
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:8px">
        <div style="width:7px;height:7px;border-radius:50%;background:${color};flex-shrink:0"></div>
        <div style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;flex:1;line-height:1.3">${stage}</div>
        <span style="font-size:10px;background:var(--bg);border:0.5px solid var(--border);padding:1px 5px;border-radius:6px;color:var(--text2)">${stageItems.length}</span>
      </div>`;
    stageItems.forEach(item => {
      const done = CONTENT_CHECKLIST.filter(ck => item[ck.key]).length;
      const pct  = Math.round(done / CONTENT_CHECKLIST.length * 100);
      html += `<div class="board-card" onclick="openContentDetail('${item.id}')">
        <div style="font-size:12px;font-weight:500;margin-bottom:4px">${item.title}</div>
        ${item.assignee ? `<div style="font-size:10px;color:var(--text2);margin-bottom:4px">${item.assignee}</div>` : ""}
        ${item.type ? `<span class="board-tag tag-link" style="margin-bottom:4px;display:inline-block">${item.type}</span>` : ""}
        <div style="height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:4px">
          <div style="height:100%;width:${pct}%;background:${pct===100?"var(--green)":pct>50?"var(--amber)":"var(--blue)"}"></div>
        </div>
        <div style="font-size:10px;color:var(--text2);margin-top:2px">${done}/${CONTENT_CHECKLIST.length} steps</div>
      </div>`;
    });
    if (isAdmin()) {
      html += `<button onclick="openContentModal('${stage}')" style="font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;padding:4px 0;width:100%;text-align:left;font-weight:500;margin-top:4px">+ Add</button>`;
    }
    html += '</div>';
  });
  html += '</div>';
  wrap.innerHTML = html;
}

window.saveContent = async function() {
  const title = document.getElementById("cm-title")?.value.trim();
  if (!title) return;
  const data = {
    title,
    stage:      document.getElementById("cm-stage")?.value || "Bank of Ideas",
    type:       document.getElementById("cm-type")?.value  || "",
    assignee:   document.getElementById("cm-assignee")?.value || currentProfile.name,
    scriptDue:  document.getElementById("cm-script-due")?.value  || "",
    uploadDue:  document.getElementById("cm-upload-due")?.value  || "",
    scriptLink: document.getElementById("cm-script-link")?.value.trim() || "",
    notes:      document.getElementById("cm-notes")?.value.trim() || "",
    createdAt:  serverTimestamp(),
    createdBy:  currentProfile.name,
  };
  // Default all checklist to false
  CONTENT_CHECKLIST.forEach(ck => { data[ck.key] = false; });

  await addDoc(collection(db,"content"), data);

  // Auto-create tasks for due dates
  if (data.scriptDue) {
    await addDoc(collection(db,"tasks"), {
      text: "Script: " + title, assignee: data.assignee || "Sophia",
      pri:"high", due:data.scriptDue, done:false,
      recur:"none", notes:"Content hub", subtasks:[], completedDates:[],
      createdAt:serverTimestamp(), createdBy:currentProfile.name,
    });
  }
  if (data.uploadDue) {
    await addDoc(collection(db,"tasks"), {
      text: "Upload: " + title, assignee: "Alli",
      pri:"med", due:data.uploadDue, done:false,
      recur:"none", notes:"Content hub", subtasks:[], completedDates:[],
      createdAt:serverTimestamp(), createdBy:currentProfile.name,
    });
  }
  toast("Content idea added ✓");
  closeContentModal();
  renderContentHub();
};

    memberOpts += `<option value="${p.name}" ${item.assignee===p.name?"selected":""}>${p.name}</option>`;

    </div>
    <div class="modal-row"><label>Script link (Google Doc)</label>
      <input type="text" id="cd-script-link" value="${item.scriptLink||""}" placeholder="https://docs.google.com/..."/>
      ${item.scriptLink ? `<a href="${item.scriptLink}" target="_blank" style="font-size:11px;color:var(--blue);margin-top:3px;display:block">Open script →</a>` : ""}
    </div>
    <div class="modal-row"><label>Canva link</label>
      <input type="text" id="cd-canva-link" value="${item.canvaLink||""}" placeholder="https://canva.com/..."/>
      ${item.canvaLink ? `<a href="${item.canvaLink}" target="_blank" style="font-size:11px;color:var(--blue);margin-top:3px;display:block">Open Canva →</a>` : ""}
    </div>
    <div class="modal-row"><label>Raw video URL</label>
      <input type="text" id="cd-video-url" value="${item.videoUrl||""}" placeholder="Drive / Dropbox link"/></div>
    <div class="modal-row"><label>Notes</label>
      <textarea id="cd-notes" style="min-height:60px">${item.notes||""}</textarea></div>
    <div style="border-top:0.5px solid var(--border);margin:12px 0 10px;padding-top:10px">
      <div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Production checklist</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${checklistHTML}</div>
    </div>
    <div class="modal-btns">
      ${isAdm ? `<button class="btn danger" onclick="deleteContent('${id}')">Delete</button>` : ""}
      <button class="btn" onclick="document.getElementById('detail-modal').remove()">Cancel</button>
      <button class="btn primary" onclick="updateContent('${id}')">Save</button>

window.updateContent = async function(id) {
  const data = {
    stage:      document.getElementById("cd-stage")?.value,
    type:       document.getElementById("cd-type")?.value,
    assignee:   document.getElementById("cd-assignee")?.value,
    scriptDue:  document.getElementById("cd-script-due")?.value || "",
    uploadDue:  document.getElementById("cd-upload-due")?.value || "",
    scriptLink: document.getElementById("cd-script-link")?.value.trim() || "",
    canvaLink:  document.getElementById("cd-canva-link")?.value.trim()  || "",
    videoUrl:   document.getElementById("cd-video-url")?.value.trim()   || "",
    notes:      document.getElementById("cd-notes")?.value || "",
    updatedAt:  serverTimestamp(),
    updatedBy:  currentProfile.name,
  };
  CONTENT_CHECKLIST.forEach(ck => {
    data[ck.key] = document.getElementById("cd-" + ck.key)?.checked || false;
  });
  await updateDoc(doc(db,"content",id), data);
  document.getElementById("detail-modal")?.remove();
  toast("Updated ✓");
  renderContentHub();
};

window.deleteContent = async function(id) {
  if (!confirm("Delete this content item?")) return;
  await deleteDoc(doc(db,"content",id));
  document.getElementById("detail-modal")?.remove();
  toast("Deleted");
  renderContentHub();
};

// assignments stored in Firestore: {personName, track, assignedBy, assignedAt}
// progress stored in Firestore: {uid, name, track, lessonIndex, lessonKey, done}

async function getMyAssignedTracks() {
  // Returns array of track names assigned to current user
  const snap = await getDocs(query(
    collection(db,"training_assignments"),
    where("personName","==",currentProfile.name)
  ));
  return snap.docs.map(d=>d.data().track);
}

async function renderTrainingHub() {
  const isAdm = isAdmin();

  if (isAdm) {
    await renderAdminTraining();
  } else {
    await renderMemberTraining();
  }
}

async function renderAdminTraining() {
  // Load all assignments
  const asnSnap = await getDocs(collection(db,"training_assignments"));
  const assignments = asnSnap.docs.map(d=>({id:d.id,...d.data()}));

  // Load progress
  const progSnap = await getDocs(collection(db,"training_progress"));
  const progress  = progSnap.docs.map(d=>d.data());

  const allTracks = Object.keys(DEFAULT_TRAINING);
  const members   = Object.values(TEAM_PROFILES);

  setMain(`
  <div class="page-title">🎓 Training hub</div>
  <div style="display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap">
    <button class="btn primary" onclick="openAssignTrackModal()">+ Assign track</button>
    <button class="btn" onclick="openAddLessonModal()">+ Add lesson</button>
    <button class="btn" onclick="renderTrainingProgress()">📊 Team progress</button>
  </div>

  <div class="two-col" style="margin-bottom:1rem">
    <!-- LEFT: tracks -->
    <div>
      <div class="card-title" style="margin-bottom:10px">Training tracks (${allTracks.length})</div>
      ${allTracks.map(track => {
        const t = DEFAULT_TRAINING[track];
        const assignees = assignments.filter(a=>a.track===track).map(a=>a.personName);
        return `<div class="card" style="margin-bottom:10px;cursor:pointer" onclick="openTrackDetail('${track}')">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px">

          </div>
          <div style="font-size:11px;color:var(--text2);margin-bottom:8px">${t.description||""}</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">
            ${assignees.length
              ? assignees.map(n=>{const p=profileOf(n);return`<div class="avatar" style="width:22px;height:22px;font-size:8px;background:${p.color};color:${p.tc}" title="${n}">${initials(n)}</div>`;}).join("")
              : `<span style="font-size:10px;color:var(--text3)">No one assigned</span>`}

        </div>`;
      }).join("")}

    <!-- RIGHT: team assignments -->

      ${members.map(m => {
        const myTracks = assignments.filter(a=>a.personName===m.name).map(a=>a.track);

        const doneLessons  = progress.filter(p=>p.name===m.name&&p.done).length;
        const pct = totalLessons ? Math.round(doneLessons/totalLessons*100) : 0;
        return `<div class="card" style="margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
            <div class="avatar" style="width:30px;height:30px;font-size:11px;background:${m.color};color:${m.tc}">${m.init}</div>

            <span style="font-size:12px;font-weight:600;color:${pct===100?"var(--green)":pct>0?"var(--amber)":"var(--text3)"}">${pct}%</span>

          ${myTracks.length
            ? `<div style="display:flex;gap:4px;flex-wrap:wrap">

                  ${t}

                </div>`).join("")}
              </div>`
            : `<div style="font-size:11px;color:var(--text3)">No tracks assigned — <button class="btn" style="font-size:10px;padding:2px 8px" onclick="openAssignTrackModal('','${m.name}')">Assign now</button></div>`}
        </div>`;
      }).join("")}
    </div>
  </div>`);

      <div style="font-size:32px;margin-bottom:12px">🎓</div>
      <div style="font-size:15px;font-weight:500;margin-bottom:6px">No tienes entrenamientos asignados aún</div>
      <div style="font-size:13px;color:var(--text2)">Sophia o Jaz te asignarán los tracks que necesitas pronto.</div>
    </div>`);
    return;
  }

  const progSnap = await getDocs(query(
    collection(db,"training_progress"),
    where("uid","==",currentUser.uid)
  ));
  const progress = {};
  progSnap.docs.forEach(d=>{const data=d.data(); progress[data.lessonKey]=data.done;});

  const totalLessons = myTracks.reduce((s,t)=>(DEFAULT_TRAINING[t]?.lessons?.length||0)+s,0);
  const doneLessons  = Object.values(progress).filter(Boolean).length;
  const overallPct   = totalLessons ? Math.round(doneLessons/totalLessons*100) : 0;

  setMain(`
  <div class="page-title">🎓 Mi entrenamiento</div>
  <div class="metrics two" style="margin-bottom:1.25rem">
    <div class="metric"><div class="ml">Progreso general</div><div class="mv" style="color:${overallPct===100?"var(--green)":overallPct>40?"var(--amber)":"var(--red)"}">${overallPct}%</div><div class="ms">${doneLessons}/${totalLessons} lecciones</div></div>
    <div class="metric"><div class="ml">Tracks asignados</div><div class="mv">${myTracks.length}</div></div>
  </div>
  ${myTracks.map(track => {
    const t = DEFAULT_TRAINING[track]; if(!t) return "";
    const lessons = t.lessons||[];
    const doneCount = lessons.filter((_,i)=>progress[`${track}:${i}`]).length;
    const pct = lessons.length ? Math.round(doneCount/lessons.length*100) : 0;
    return `<div class="card" style="margin-bottom:1rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="font-weight:600;font-size:14px">${track}</div>
        <span style="font-size:12px;color:var(--text2)">${doneCount}/${lessons.length} · ${pct}%</span>
      </div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px">${t.description}</div>
      <div class="track" style="margin-bottom:14px"><div class="fill ${pct===100?"g":pct>40?"a":"r"}" style="width:${pct}%"></div></div>
      ${lessons.map((l,i)=>{
        const key=`${track}:${i}`;
        const done=progress[key];
        return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border)">
          <input type="checkbox" ${done?"checked":""} style="width:15px;height:15px;accent-color:var(--text);flex-shrink:0"
            onchange="markLesson('${track}',${i},this.checked)">
          <div style="flex:1">
            <div style="font-size:13px;font-weight:${done?"400":"500"};${done?"text-decoration:line-through;color:var(--text3)":""}">${l.title}</div>
            <div style="font-size:11px;color:var(--text2)">${l.type==="video"?"🎬 Video":"📄 Documento"} · ${l.duration}</div>
          </div>
          ${l.url?`<a href="${l.url}" target="_blank" class="btn" style="font-size:11px;white-space:nowrap">Abrir →</a>`:""}
        </div>`;
      }).join("")}
    </div>`;
  }).join("")}`);
}

window.assignTrack = async function() {

  const track      = document.getElementById("at-track").value;
  if (!personName || !track) { toast("Select both a person and a track"); return; }

// ── TODAY & WEEK VIEW ──
async function renderWeekView() {
  const today    = new Date();
  const todayStr = today.toISOString().split("T")[0];
  const [taskSnap, eventSnap, contentSnap] = await Promise.all([
    getDocs(collection(db,"tasks")),
    getDocs(collection(db,"events")),
    getDocs(collection(db,"content")),
  ]);
  const allTasks   = taskSnap.docs.map(d=>({id:d.id,...d.data()}));
  const allEvents  = eventSnap.docs.map(d=>({id:d.id,...d.data()}));
  const allContent = contentSnap.docs.map(d=>({id:d.id,...d.data()}));
  const myTasks    = isAdmin() ? allTasks : allTasks.filter(t=>t.assignee===currentProfile.name);

  function getItems(ds) {
    const out = [];
    myTasks.filter(t=>t.due===ds).forEach(t=>out.push({
      type:"task", title:t.text, sub:t.assignee,
      color:t.done?"#aaa":t.pri==="high"?"#a32d2d":t.pri==="med"?"#854f0b":"#3b6d11",
      emoji:t.done?"✅":"📌", done:t.done, id:t.id,
    }));
    allEvents.filter(e=>e.date===ds).forEach(e=>out.push({
      type:"event", title:e.title,
      sub:(e.time||"")+(e.assignee?" · "+e.assignee:""),
      color:e.color||"#185fa5", emoji:"📅",
    }));
    allContent.filter(x=>x.scriptDue===ds).forEach(x=>out.push({type:"content",title:"Script: "+x.title,sub:x.assignee||"",color:"#3b6d11",emoji:"📝"}));
    allContent.filter(x=>x.uploadDue===ds).forEach(x=>out.push({type:"content",title:"Upload: "+x.title,sub:x.assignee||"",color:"#3b6d11",emoji:"🎬"}));
    return out;
  }

  const overdue  = myTasks.filter(t=>!t.done && t.due && t.due < todayStr);
  const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const days     = [];
  for (let i=0;i<7;i++){const d=new Date(today);d.setDate(today.getDate()+i);days.push(d);}

  // Build using DOM to avoid ALL quote conflicts
  const wrap = document.getElementById("cal-main-view");
  wrap.innerHTML = "";

  // Overdue section
  if (overdue.length) {
    const card = document.createElement("div");
    card.className = "card";
    card.style.cssText = "border-left:3px solid var(--red);margin-bottom:1rem";
    card.innerHTML = "<div class='card-head'><div class='card-title' style='color:var(--red)'>🔴 Overdue (" + overdue.length + ")</div></div>";
    overdue.forEach(t => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--border)";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.style.accentColor = "var(--text)";
      cb.addEventListener("change", () => toggleTask(t.id, "none"));
      const info = document.createElement("div");
      info.style.flex = "1";
      info.innerHTML = "<div style='font-size:13px;font-weight:500;color:var(--red)'>" + t.text + "</div>" +
        "<div style='font-size:11px;color:var(--text2)'>" + t.assignee + " · was due " + fmtDate(t.due) + "</div>";
      const bdg = document.createElement("span");
      bdg.className = "badge high"; bdg.textContent = "overdue";
      row.append(cb, info, bdg);
      card.appendChild(row);
    });
    wrap.appendChild(card);
  }

  // Day sections
  days.forEach((d, i) => {
    const ds    = d.toISOString().split("T")[0];
    const items = getItems(ds);
    const isToday = i === 0;
    if (!isToday && !items.length) return;

    const label     = isToday ? "Today" : i===1 ? "Tomorrow" : dayNames[d.getDay()];
    const dateLabel = d.toLocaleDateString("en-US",{month:"short",day:"numeric"});

    const card = document.createElement("div");
    card.className = "card";
    card.style.cssText = "margin-bottom:10px;" + (isToday ? "border-left:3px solid var(--blue)" : "");

    const head = document.createElement("div");
    head.className = "card-head";
    head.style.marginBottom = items.length ? "12px" : "0";
    const titleDiv = document.createElement("div");
    titleDiv.innerHTML = "<div style='font-size:14px;font-weight:600'>" + label + "</div><div style='font-size:11px;color:var(--text2)'>" + dateLabel + "</div>";
    head.appendChild(titleDiv);
    if (isAdmin()) {
      const addBtn = document.createElement("button");
      addBtn.className = "btn";
      addBtn.style.fontSize = "11px";
      addBtn.textContent = "+ Add";
      addBtn.addEventListener("click", () => openEventModal(ds));
      head.appendChild(addBtn);
    }
    card.appendChild(head);

    if (items.length) {
      items.forEach(item => {
        const row = document.createElement("div");
        row.style.cssText = "display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--border)";
        const bar = document.createElement("div");
        bar.style.cssText = "width:3px;min-height:36px;border-radius:2px;background:" + item.color + ";flex-shrink:0";
        const emoji = document.createElement("span");
        emoji.style.fontSize = "16px";
        emoji.textContent = item.emoji;
        const body = document.createElement("div");
        body.style.flex = "1";
        const strike = item.done ? "text-decoration:line-through;color:var(--text3)" : "";
        body.innerHTML = "<div style='font-size:13px;font-weight:500;" + strike + "'>" + item.title + "</div>" +
          "<div style='font-size:11px;color:var(--text2)'>" + (item.sub||"") + "</div>";
        row.append(bar, emoji, body);
        if (item.type === "task") {
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = item.done;
          cb.style.accentColor = "var(--text)";
          cb.addEventListener("change", () => toggleTask(item.id, "none"));
          row.appendChild(cb);
        }
        card.appendChild(row);
      });
    } else {
      const empty = document.createElement("div");
      empty.style.cssText = "font-size:12px;color:var(--text3);padding:4px 0";
      empty.textContent = "No items scheduled";
      card.appendChild(empty);
    }
    wrap.appendChild(card);
  });

  // Quick add task
  const addCard = document.createElement("div");
  addCard.className = "card";
  addCard.style.marginTop = "0.5rem";
  addCard.innerHTML = "<div class='card-head'><div class='card-title'>+ Quick add task</div></div>" +
    "<div class='add-row'>" +

    "<button class='btn primary' onclick='quickAddCalTask()'>Add</button></div>";
  wrap.appendChild(addCard);
}

// ── MONTH VIEW ──
async function renderMonthView() {
  const y = calDate.getFullYear(), m = calDate.getMonth();
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const [taskSnap, eventSnap, contentSnap] = await Promise.all([
    getDocs(collection(db,"tasks")),
    getDocs(collection(db,"events")),
    getDocs(collection(db,"content")),
  ]);
  const allTasks   = taskSnap.docs.map(d=>({id:d.id,...d.data()}));
  const allEvents  = eventSnap.docs.map(d=>({id:d.id,...d.data()}));
  const allContent = contentSnap.docs.map(d=>({id:d.id,...d.data()}));
  const myTasks    = isAdmin() ? allTasks : allTasks.filter(t=>t.assignee===currentProfile.name);
  const today      = new Date();

  // Build dot map
  const dotMap = {};
  const addDot = (ds,color) => { if(!dotMap[ds]) dotMap[ds]=[]; dotMap[ds].push(color); };
  myTasks.filter(t=>t.due).forEach(t=>addDot(t.due, t.done?"#aaa":t.pri==="high"?"#a32d2d":"#3b6d11"));
  allEvents.forEach(e=>addDot(e.date, e.color||"#185fa5"));
  allContent.filter(c=>c.scriptDue).forEach(c=>addDot(c.scriptDue,"#3b6d11"));
  allContent.filter(c=>c.uploadDue).forEach(c=>addDot(c.uploadDue,"#3b6d11"));

  const first = new Date(y,m,1).getDay();
  const days  = new Date(y,m+1,0).getDate();
  const dayNames = ["Su","Mo","Tu","We","Th","Fr","Sa"];

  // Build grid HTML without nested template literals
  let gridHTML = "";
  dayNames.forEach(dn => {
    gridHTML += "<div style='text-align:center;font-size:10px;color:var(--text2);padding:4px;font-weight:600'>" + dn + "</div>";
  });

  let dayGridHTML = "";
  for (let i=0; i<first; i++) dayGridHTML += "<div></div>";
  for (let day=1; day<=days; day++) {
    const ds = y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    const isToday = today.getFullYear()===y && today.getMonth()===m && today.getDate()===day;
    const dots = (dotMap[ds]||[]).slice(0,3);
    let dotsHTML = "";
    dots.forEach(color => { dotsHTML += "<div style='width:5px;height:5px;border-radius:50%;background:"+color+"'></div>"; });
    const bg    = isToday ? "var(--text)" : "transparent";
    const color = isToday ? "var(--bg)"   : "var(--text)";
    const fw    = isToday ? "600" : "400";
        dayGridHTML += '<div data-ds="' + ds + '" class="month-day-btn" style="text-align:center;padding:6px 2px;border-radius:7px;cursor:pointer;background:' + bg + ';color:' + color + ';font-weight:' + fw + '">' +
      "<div style='font-size:12px;font-weight:"+fw+"'>"+day+"</div>" +
      "<div style='display:flex;gap:2px;justify-content:center;margin-top:2px'>"+dotsHTML+"</div></div>";
  }

  document.getElementById("cal-main-view").innerHTML =
    "<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:12px'>" +
      "<div style='font-size:15px;font-weight:600'>" + months[m] + " " + y + "</div>" +
      "<div style='display:flex;gap:6px'>" +
        "<button class='btn' onclick='calDate.setMonth(calDate.getMonth()-1);renderMonthView()' style='padding:4px 12px'>‹</button>" +
        "<button class='btn' onclick='calDate.setMonth(calDate.getMonth()+1);renderMonthView()' style='padding:4px 12px'>›</button>" +
      "</div>" +
    "</div>" +
    "<div style='display:grid;grid-template-columns:1fr 1fr;gap:1rem'>" +
      "<div>" +
        "<div style='display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px'>" + gridHTML + "</div>" +
        "<div style='display:grid;grid-template-columns:repeat(7,1fr);gap:3px'>" + dayGridHTML + "</div>" +
      "</div>" +
      "<div id='month-day-detail' style='font-size:13px;color:var(--text2);padding:1rem 0'>Click a day to see details</div>" +
    "</div>";

  // Wire clicks on day cells
  document.querySelectorAll('.month-day-btn').forEach(el => {
    el.addEventListener('click', () => selectMonthDay(el.dataset.ds, allTasks, allEvents, allContent));
  });
  // Pre-select today
  selectMonthDay(today.toISOString().split("T")[0], allTasks, allEvents, allContent);
}

const GHL_API_KEY = "pit-85851399-87f4-476b-a88a-28f2e755b0d5";
const GHL_BASE    = "https://services.leadconnectorhq.com";

async function ghlFetch(path) {
  try {
    const res = await fetch(`${GHL_BASE}${path}`, {
      headers: { "Authorization": `Bearer ${GHL_API_KEY}`, "Version": "2021-07-28", "Accept": "application/json" }
    });
    if (!res.ok) throw new Error(`GHL ${res.status}`);
    return await res.json();
  } catch(e) {
    console.warn("GHL fetch error:", e);
    return null;
  }
}

      ${id?`<button class="btn danger" onclick="deleteGoal('${id}')">Delete</button>`:""}
      <button class="btn" onclick="document.getElementById('goal-modal').remove()">Cancel</button>
      <button class="btn primary" onclick="saveGoal('${id||""}')">Save</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
};


window.saveFinancial = async function() {
  const amount = parseFloat(document.getElementById("fn-amount").value); if(!amount) return;
  await addDoc(collection(db,"financials"),{
    type:   document.getElementById("fn-type").value,
    label:  document.getElementById("fn-label").value.trim(),
    amount, date: document.getElementById("fn-date").value,
    note:   document.getElementById("fn-note").value.trim(),
    createdAt: serverTimestamp(), createdBy: currentProfile.name,
  });
  document.getElementById("fin-modal")?.remove();
  toast("Entry saved ✓"); renderFinancials();
};


window.filterContent = async function(type,btn) {
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  await loadContentBoard(type==="all"?"all":type);
};

window.doLogin  = doLogin;
window.doLogout = doLogout;
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f7f7f5;--bg3:#efefec;
  --text:#181816;--text2:#6a6a67;--text3:#ababA8;
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.13);
  --r:8px;--rl:12px;
  --green-bg:#eaf3de;--green:#3b6d11;
  --amber-bg:#faeeda;--amber:#854f0b;
  --red-bg:#fcebeb;--red:#a32d2d;
  --blue-bg:#e6f1fb;--blue:#185fa5;
  --purple-bg:#eeedfe;--purple:#534ab7;
  --teal-bg:#e1f5ee;--teal:#0f6e56;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a18;--bg2:#222220;--bg3:#2a2a28;
  --text:#f0efe8;--text2:#8a8a87;--text3:#4a4a48;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
}}
html,body{height:100%;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button,input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}

/* LOGIN */
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:var(--bg)}
.login-box{width:100%;max-width:360px}
.login-logo{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px;text-align:center}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:2rem;text-align:center}
.login-field{margin-bottom:12px}
.login-field label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px}
.login-field input{width:100%;font-size:14px;padding:10px 12px;border-radius:var(--r);border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);outline:none}
.login-field input:focus{border-color:var(--blue)}
#login-btn{width:100%;padding:11px;border-radius:var(--r);border:none;background:var(--text);color:var(--bg);font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
#login-btn:hover{opacity:.85}
#login-err{font-size:12px;color:var(--red);margin-top:8px;text-align:center;min-height:16px}

/* APP */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:200px;flex-shrink:0;border-right:0.5px solid var(--border);display:flex;flex-direction:column;background:var(--bg)}
.main{flex:1;overflow-y:auto;padding:1.5rem 1.75rem}
.sidebar-top{padding:16px;border-bottom:0.5px solid var(--border)}
.sidebar-logo{font-size:15px;font-weight:600;letter-spacing:-.02em}
.sidebar-uinfo{margin-top:6px}
.sidebar-uname{font-size:13px;font-weight:500}
.sidebar-urole{font-size:11px;color:var(--text2)}
.nav-list{flex:1;padding:8px 8px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);font-size:13px;color:var(--text2);cursor:pointer;margin-bottom:1px;border:none;background:none;width:100%;text-align:left;transition:all .12s}
.nav-item:hover{background:var(--bg2);color:var(--text)}
.nav-item.active{background:var(--bg2);color:var(--text);font-weight:500}
.nav-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:12px 16px;border-top:0.5px solid var(--border)}
.logout-btn{font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer}
.logout-btn:hover{color:var(--text2)}

/* COMPONENTS */
.page-title{font-size:18px;font-weight:600;letter-spacing:-.02em;margin-bottom:1.25rem}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
.metrics.two{grid-template-columns:repeat(2,1fr)}
.metric{background:var(--bg2);border-radius:var(--r);padding:14px 16px}
.ml{font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.mv{font-size:22px;font-weight:600;letter-spacing:-.02em}
.ms{font-size:11px;color:var(--text2);margin-top:2px}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:1.1rem 1.25rem;margin-bottom:1rem}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.btn{font-size:12px;padding:6px 12px;border-radius:6px;border:0.5px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;font-weight:500;transition:all .12s}
.btn:hover{background:var(--bg2)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{opacity:.85}
.btn.danger{color:var(--red);border-color:var(--red)}
.badge{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:600;flex-shrink:0;white-space:nowrap}
.badge.high{background:var(--red-bg);color:var(--red)}
.badge.med{background:var(--amber-bg);color:var(--amber)}
.badge.low,.badge.approved,.badge.ceo,.badge.coo{background:var(--green-bg);color:var(--green)}
.badge.done-b{background:var(--bg2);color:var(--text3)}
.badge.info,.badge.coach,.badge.editor{background:var(--blue-bg);color:var(--blue)}
.badge.pending,.badge.sales,.badge.design,.badge.service,.badge.copy{background:var(--amber-bg);color:var(--amber)}
.badge.denied{background:var(--red-bg);color:var(--red)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.empty{font-size:13px;color:var(--text2);padding:10px 0}
.add-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.add-row input,.add-row select{font-size:12px;padding:7px 10px;border-radius:6px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);outline:none}
.add-row input{flex:1;min-width:120px}
.filter-row{display:flex;gap:5px;flex-wrap:wrap}
.filter-btn{font-size:11px;padding:4px 10px;border-radius:10px;border:0.5px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-weight:500;transition:all .12s}
.filter-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.filter-btn:hover:not(.active){background:var(--bg2)}

/* TASKS */
.task-item{border-bottom:0.5px solid var(--border)}
.task-item:last-child{border-bottom:none}
.task-row-inner,.task-row-simple{display:flex;align-items:center;gap:10px;padding:9px 0}
.task-cb{width:15px;height:15px;cursor:pointer;flex-shrink:0;accent-color:var(--text)}
.task-body{flex:1;min-width:0}
.task-name{font-size:13px;font-weight:500}
.task-name.done{text-decoration:line-through;color:var(--text3);font-weight:400}
.task-sub{font-size:11px;color:var(--text2);margin-top:1px;display:flex;gap:8px;flex-wrap:wrap}
.task-actions{display:flex;gap:4px}
.icon-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:3px 5px;border-radius:4px;color:var(--text2)}
.icon-btn:hover{background:var(--bg2);color:var(--text)}
.recur-tag{font-size:10px;background:var(--teal-bg);color:var(--teal);padding:1px 6px;border-radius:4px;font-weight:600}
.tmpl-tag{font-size:10px;background:var(--purple-bg);color:var(--purple);padding:1px 6px;border-radius:4px;font-weight:600}

/* BOARDS */
.board-cols{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:1rem}
.board-col{background:var(--bg2);border-radius:var(--rl);padding:10px;min-height:200px;min-width:180px}
.board-col-title{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.board-count{font-size:10px;background:var(--bg);border:0.5px solid var(--border);padding:1px 6px;border-radius:8px;color:var(--text2)}
.board-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:all .12s}
.board-card:hover{border-color:var(--border2)}
.board-card-title{font-size:12px;font-weight:500}
.board-tag{font-size:10px;padding:2px 6px;border-radius:4px;display:inline-block;font-weight:600}
.tag-content{background:var(--purple-bg);color:var(--purple)}
.tag-link{background:var(--blue-bg);color:var(--blue)}
.tag-idea{background:var(--amber-bg);color:var(--amber)}
.tag-sop{background:var(--green-bg);color:var(--green)}
.add-card-btn{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;padding:4px 0;width:100%;text-align:left;font-weight:500}
.add-card-btn:hover{color:var(--text2)}

/* MISC */
.team-row,.pay-row,.off-req,.sales-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--border)}
.team-row:last-child,.pay-row:last-child,.off-req:last-child,.sales-row:last-child{border-bottom:none}
.date-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.date-inputs label{font-size:11px;color:var(--text2);font-weight:500;display:block;margin-bottom:4px}
.date-inputs input{width:100%;font-size:12px;padding:7px 9px;border-radius:6px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);outline:none}
.announce{background:var(--bg2);border-radius:var(--r);padding:12px;margin-bottom:8px;border-left:3px solid var(--border2)}
.announce-title{font-size:13px;font-weight:500;margin-bottom:2px}
.announce-meta{font-size:11px;color:var(--text2)}
.links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.link-card{background:var(--bg2);border-radius:var(--r);padding:14px;border:0.5px solid var(--border);display:block;transition:all .15s}
.link-card:hover{background:var(--bg);border-color:var(--border2);transform:translateY(-1px)}
.link-icon{font-size:20px;margin-bottom:6px}
.link-name{font-size:13px;font-weight:600}
.link-desc{font-size:11px;color:var(--text2);margin-top:1px}
.goal-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:0.5px solid var(--border)}
.goal-row:last-child{border-bottom:none}
.track{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.fill{height:100%;border-radius:3px}
.fill.g{background:var(--green)}.fill.a{background:var(--amber)}.fill.r{background:var(--red)}
.up{color:var(--green);font-size:11px;font-weight:600}
.dn{color:var(--red);font-size:11px;font-weight:600}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--bg);border-radius:var(--rl);padding:1.5rem;width:460px;max-width:95vw;border:0.5px solid var(--border2);max-height:90vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:600;margin-bottom:1rem}
.modal-row{margin-bottom:12px}
.modal-row label{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.modal-row input,.modal-row select,.modal-row textarea{width:100%;font-size:13px;padding:8px 10px;border-radius:6px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);outline:none}
.modal-row textarea{min-height:70px;resize:vertical}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.tmpl-item{padding:10px;border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:all .12s}
.tmpl-item:hover{background:var(--bg2);border-color:var(--border2)}

/* AI MODAL */
#ai-result{margin-top:12px;font-size:12px;white-space:pre-wrap;background:var(--bg2);border-radius:var(--r);padding:12px;min-height:80px;max-height:300px;overflow-y:auto;color:var(--text)}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <div class="login-logo">⚡ OpsHQ</div>
    <div class="login-sub">Inversiones Para Latinos — Team Portal</div>
    <div class="login-field"><label>Email</label><input type="email" id="l-email" placeholder="you@inversiones.com" autocomplete="email"/></div>
    <div class="login-field"><label>Password</label><input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password"/></div>
    <button id="login-btn">Sign in</button>
    <div id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none">
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo">⚡ OpsHQ</div>
      <div class="sidebar-uinfo">
        <div class="sidebar-uname" id="sidebar-name"></div>
        <div class="sidebar-urole" id="sidebar-role"></div>
      </div>
    </div>
    <div class="nav-list" id="nav-list"></div>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="doLogout()">← Sign out</button>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<!-- TASK MODAL -->
<div class="modal-overlay" id="task-modal" style="display:none" onclick="if(event.target===this)closeTaskModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="tm-title">New task</h3>
    <div class="modal-row"><label>Task name</label><input type="text" id="tm-name" placeholder="What needs to be done?"/></div>
    <div class="modal-row"><label>Assign to</label><select id="tm-who"></select></div>
    <div class="modal-row"><label>Priority</label>
      <select id="tm-pri"><option value="high">🔴 High</option><option value="med" selected>🟡 Med</option><option value="low">🟢 Low</option></select></div>
    <div class="modal-row"><label>Due date</label><input type="date" id="tm-due"/></div>
    <div class="modal-row"><label>Recurring</label>
      <select id="tm-recur"><option value="none">None</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div>
    <div class="modal-row"><label>Notes</label><textarea id="tm-notes" placeholder="Any context..."></textarea></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeTaskModal()">Cancel</button>
      <button class="btn" onclick="openTemplateModal()">📋 Use template</button>
      <button class="btn primary" onclick="saveTask()">Save task</button>
    </div>
  </div>
</div>

<!-- TEMPLATE MODAL -->
<div class="modal-overlay" id="template-modal" style="display:none" onclick="if(event.target===this)closeTemplateModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>Choose a template</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:12px">This will create all steps as individual tasks assigned to the selected person.</p>
    <div id="tmpl-list"></div>
    <div class="modal-btns"><button class="btn" onclick="closeTemplateModal()">Cancel</button></div>
  </div>
</div>

<!-- CONTENT MODAL (rendered by JS) -->
<div class="modal-overlay" id="content-modal" style="display:none" onclick="if(event.target===this)closeContentModal()"></div>

<!-- AI SCRIPT MODAL -->
<div class="modal-overlay" id="ai-modal" style="display:none" onclick="if(event.target===this)closeAIModal()">
  <div class="modal" style="width:560px" onclick="event.stopPropagation()">
    <h3>🤖 AI Script Generator</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:12px">Uses Jaz's script style & voice. Enter a topic and get a ready-to-record script.</p>
    <div class="modal-row"><label>Topic / idea</label><input type="text" id="ai-topic" placeholder="e.g. Cómo invertir con $500 siendo inmigrante"/></div>
    <div class="modal-row"><label>Format</label>
      <select id="ai-type">
        <option value="short">📱 Short-form (60-90s Reel/TikTok)</option>
        <option value="long">▶️ Long-form YouTube (8-12 min)</option>
        <option value="company">📊 Company/Investment Analysis</option>
        <option value="class">🎓 Live Class / Webinar Script</option>
      </select></div>
    <button class="btn primary" style="width:100%;margin-bottom:4px" onclick="generateScript()">Generate script</button>
    <div id="ai-result"></div>
    <div class="modal-btns" style="margin-top:8px">
      <button class="btn" onclick="closeAIModal()">Close</button>
      <button class="btn primary" onclick="navigator.clipboard.writeText(document.getElementById('ai-result').textContent).then(()=>toast('Copied!'))">Copy script</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// Populate content assignee dropdown after page loads
document.addEventListener("DOMContentLoaded", () => {
  const sel = document.getElementById("cm-assignee");
  if (sel && typeof TEAM_PROFILES !== "undefined") {
    sel.innerHTML = Object.values(TEAM_PROFILES).map(p=>`<option value="${p.name}">${p.name}</option>`).join("");
  }
});
</script>
</body>
